services:
  - type: web
    name: gitbadge-auto-free
    runtime: node
    buildCommand: cd frontend && npm install && npm run build && cd .. && cp -r frontend/dist backend/public && cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
